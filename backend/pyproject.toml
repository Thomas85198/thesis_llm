[project]
name = "thesis-llm-demo-v3"
version = "0.1.0"
description = "論文檢核系統：EDU → ER → RST/FRU → Neo4j KG → 13 REL 規則檢核"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "openai>=1.55",
    # "anthropic>=0.40",  # preserved for reference; re-enable to switch back
    "neo4j>=5.26",
    "pydantic>=2.10",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.10",
]

[project.optional-dependencies]
# Dev/test only — install with: pip install -e ".[test]"
test = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Unit tests must not touch the network/LLM/Neo4j. Anything that does belongs
# behind a marker and is opt-in.
addopts = "-q"
# Silence PyMuPDF's SWIG-binding DeprecationWarnings (C-extension noise emitted
# on import under newer Python; nothing to do with our code). Targeted so real
# deprecations from our own code still surface.
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
