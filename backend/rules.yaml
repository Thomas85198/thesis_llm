# 13 條全域通用 REL 規則 (志祥學長從 51 條章節規則 MECE 收斂而來)
#
# 每條規則:
#   id: REL-XX
#   name: 規則名稱
#   description: 規則白話描述 (給 LLM 判讀)
#   candidate_query: Cypher 查詢，回傳「可能違反規則」的候選節點/路徑
#   defect_label: 違反時記錄的缺陷標籤 (對應老師舉的缺陷型態)
#
# 規則的精確語意應由學長維護。下方 candidate_query 為起步版本，
# 用於把 KG 中相關子圖撈出來丟給 LLM 做最終判讀。

rules:
  - id: REL-01
    name: Claim-Evidence
    description: |
      每個主張 (Claim) 都應該有對應的證據 (Evidence) 支撐 — 量化數據、引用、實驗結果或邏輯推論。
      孤立、無支撐的主張 (The Naked Claim) 是常見缺陷。
    candidate_query: |
      MATCH (f:FRU {paper_id: $pid, function: 'Claim'})
      WHERE NOT EXISTS {
        MATCH (e:FRU {paper_id: $pid, function: 'Evidence'})-[:COVERS]->(:EDU)<-[:COVERS]-(f)
      }
      AND NOT EXISTS {
        MATCH (f)-[:COVERS]->(:EDU)<-[:NUCLEUS|SATELLITE]-(:RST {rst_type: 'Evidence'})
      }
      RETURN f.id AS fru_id, f.summary AS summary,
             [(f)-[:COVERS]->(e:EDU) | e.id] AS edu_ids,
             [(f)-[:COVERS]->(e:EDU) | e.text] AS edu_texts,
             [(f)-[:COVERS]->(e:EDU) | e.section][0] AS section
    defect_label: NakedClaim

  - id: REL-02
    name: Baseline-Critique
    description: |
      在 Method/Experiment 中提到 baseline 時，應有對其侷限或不足的批判，
      作為自身方法的對照動機。只列 baseline 不批判是缺陷。
    candidate_query: |
      // 依 description 限定 Method/Experiment（含 Results）章節的提及。
      // 原版不限章節，Introduction/Related Work 的 survey 式提及
      // 讓每個 Method 實體都進候選 → 候選膨脹、誤報面擴大。
      MATCH (e:Entity {paper_id: $pid})
      WHERE toLower(e.name) CONTAINS 'baseline'
         OR e.type = 'Method'
      MATCH (e)-[:MENTIONED_IN]->(edu:EDU)
      WHERE edu.section IN ['Method', 'Experiment', 'Results']
      WITH e, collect(DISTINCT edu.id) AS edu_ids, collect(DISTINCT edu.text) AS edu_texts,
           collect(DISTINCT edu.section) AS sections
      RETURN e.id AS entity_id, e.name AS entity_name, edu_ids, edu_texts, sections
    defect_label: BaselineNotCritiqued

  - id: REL-03
    name: Action-Justification
    description: |
      對每個關鍵研究行動 (選某資料集/某評估指標/某架構) 都應有合理化說明。
      無動機交代 (Missing Motivation) 是常見缺陷。
    candidate_query: |
      // 對每個 MethodStep FRU，檢查同章節、order 鄰近範圍內是否有 Motivation
      // （動機通常在步驟之前，所以往前看得比往後遠）。原版是 paper-global
      // NOT EXISTS：全篇任一 Motivation 就放過所有 MethodStep（REL-09 已改
      // proximity，這裡跟上）。
      MATCH (f:FRU {paper_id: $pid, function: 'MethodStep'})-[:COVERS]->(f_edu:EDU)
      WITH f, f_edu.section AS section,
           min(f_edu.order) AS f_start,
           max(f_edu.order) AS f_end,
           collect(f_edu.id)   AS edu_ids,
           collect(f_edu.text) AS edu_texts

      OPTIONAL MATCH (m:FRU {paper_id: $pid, function: 'Motivation'})-[:COVERS]->(m_edu:EDU)
      WHERE m_edu.section = section
        AND m_edu.order >= f_start - 8
        AND m_edu.order <= f_end + 3

      WITH f, section, edu_ids, edu_texts, count(DISTINCT m) AS nearby_motivation_count
      WHERE nearby_motivation_count = 0

      RETURN f.id AS fru_id, f.summary AS summary, edu_ids, edu_texts, section
    defect_label: MissingMotivation

  - id: REL-04
    name: Macro-Decomposition
    description: |
      論文整體應有清楚的巨觀結構拆解 — 大問題拆成子問題，子問題拆成子方法。
      若 Introduction 沒有交代問題拆解、或 Method 沒有與問題對應的子模組，是缺陷。
    candidate_query: |
      MATCH (p:Paper {id: $pid})
      OPTIONAL MATCH (p)-[:HAS_EDU]->(e:EDU {section: 'Introduction'})<-[:COVERS]-(f:FRU)
      WITH p, collect(DISTINCT f.function) AS intro_fns
      RETURN p.id AS paper_id, intro_fns
    defect_label: NoMacroDecomposition

  - id: REL-05
    name: Process-Sequence
    description: |
      Method 章節中的步驟應有明確時序 (先做什麼後做什麼)，並用適當連接詞或編號表達。
      時序混亂或跳躍是缺陷。
    candidate_query: |
      MATCH (e:EDU {paper_id: $pid, section: 'Method'})
      WITH collect({id: e.id, text: e.text, order: e.order}) AS method_edus
      RETURN method_edus
    defect_label: WeakProcessSequence

  - id: REL-06
    name: Concept-Formalization
    description: |
      新引入的概念/術語/變數應該被形式化定義 (數學定義、操作型定義或公式)，不能只用比喻或模糊描述。
    candidate_query: |
      MATCH (n:Entity {paper_id: $pid})
      WHERE n.type IN ['Concept', 'Metric']
      OPTIONAL MATCH (n)-[:MENTIONED_IN]->(e:EDU)
      WITH n, collect(DISTINCT e.id) AS edu_ids, collect(DISTINCT e.text) AS edu_texts
      RETURN n.id AS entity_id, n.name AS entity_name, edu_ids, edu_texts
    defect_label: ConceptNotFormalized

  - id: REL-07
    name: Setup-Scoping
    description: |
      實驗章節 (Experiment) 應交代實驗設定範圍 (資料、超參、硬體、評估協議)，
      範圍模糊會使結果不可重現。
    candidate_query: |
      MATCH (e:EDU {paper_id: $pid, section: 'Experiment'})
      WITH collect({id: e.id, text: e.text}) AS exp_edus
      RETURN exp_edus
    defect_label: SetupNotScoped

  - id: REL-08
    name: Problem-Solution
    description: |
      論文應有清楚的「問題 → 解決方案」對應 — Introduction 提出的每個 problem
      應在 Method 對應一個 solution，反之亦然。
    candidate_query: |
      MATCH (p:Paper {id: $pid})
      OPTIONAL MATCH (p)-[:HAS_EDU]->(e1:EDU {section: 'Introduction'})<-[:COVERS]-(f1:FRU)
      OPTIONAL MATCH (p)-[:HAS_EDU]->(e2:EDU {section: 'Method'})<-[:COVERS]-(f2:FRU)
      WITH collect(DISTINCT {id: f1.id, fn: f1.function, summary: f1.summary}) AS intro_fru,
           collect(DISTINCT {id: f2.id, fn: f2.function, summary: f2.summary}) AS method_fru
      RETURN intro_fru, method_fru
    defect_label: ProblemSolutionMismatch

  - id: REL-09
    name: Observation-Attribution
    description: |
      在 Results / Discussion / Experiment 章節中，**值得注意的觀察**
      （顯著數字差異、效能變化、出乎意料的現象）若沒有配對的解釋
      （Attribution，說明 why），就是缺陷。

      什麼算 Attribution（不要 flag）：
      - 同段內的因果片語：「because / due to / we attribute this to / X 導致 Y」
      - 緊接其後的解釋段落（FRU function = Attribution）
      - 引用外部解釋：「as shown by Smith et al.」、「consistent with prior work」
      - 圖表中的對照組已暗示原因（例如 ablation study 表格）

      什麼**不需要**歸因（保守，不要 flag）：
      - 純粹事實敘述：「我們用了 8 個 GPU」、「資料集包含 60K 句子」
      - 例行 baseline 報告：「Method A: 60.3 BLEU; Method B: 60.5 BLEU」
      - 中性的描述句，沒有「值得注意」的語氣
      - 已被同段或前段上下文明顯解釋的觀察

      **保守原則**：只 flag 帶有「值得注意」語氣（significantly / surprisingly /
      interestingly / notably / however / but / unexpected），但完全沒嘗試
      解釋 why 的句子。中性的描述性敘述請放過 — 寧可 false negative，
      不要 false positive。

      候選資料中已附 `section` 與 evidence 文字；若文字本身帶有任何因果
      連接詞（because, since, due to, as, owing to, attribute, explain），
      代表已內含 attribution → 不算違規。
    candidate_query: |
      // 對每個 Observation FRU，檢查同章節、order 鄰近範圍內是否有 Attribution。
      // 若沒有，才當候選。比起原本「全文有沒有 Attribution」，這個
      // proximity 檢查能避免「全篇有一段歸因就放過所有 observation」的反例。
      MATCH (obs:FRU {paper_id: $pid, function: 'Observation'})-[:COVERS]->(obs_edu:EDU)
      WHERE obs_edu.section IN ['Results', 'Discussion', 'Experiment']
      WITH obs, obs_edu.section AS section,
           min(obs_edu.order) AS obs_start,
           max(obs_edu.order) AS obs_end,
           collect(obs_edu.id)   AS evidence_ids,
           collect(obs_edu.text) AS evidence_texts

      OPTIONAL MATCH (attr:FRU {paper_id: $pid, function: 'Attribution'})-[:COVERS]->(attr_edu:EDU)
      WHERE attr_edu.section = section
        AND attr_edu.order >= obs_start - 3
        AND attr_edu.order <= obs_end + 8

      WITH obs, section, obs_start, obs_end, evidence_ids, evidence_texts,
           count(DISTINCT attr) AS nearby_attribution_count
      WHERE nearby_attribution_count = 0

      RETURN obs.id   AS fru_id,
             obs.summary AS summary,
             section,
             obs_start,
             obs_end,
             evidence_ids   AS edu_ids,
             evidence_texts AS edu_texts
    defect_label: ObservationWithoutAttribution

  - id: REL-10
    name: Concession-Compensation
    description: |
      承認侷限 (Concession) 後應有補償策略 (Compensation) — 例如未來工作、可行替代或範圍說明。
      只承認不補償會弱化論證。
    candidate_query: |
      // 對每個 Concession FRU，檢查同章節、order 鄰近範圍內是否有 Compensation
      // （補償通常緊接在讓步之後，所以往後看得比往前遠）。原版是 paper-global
      // NOT EXISTS 反模式（同 REL-03），已套 REL-09 的 proximity 寫法。
      MATCH (f:FRU {paper_id: $pid, function: 'Concession'})-[:COVERS]->(f_edu:EDU)
      WITH f, f_edu.section AS section,
           min(f_edu.order) AS f_start,
           max(f_edu.order) AS f_end,
           collect(f_edu.id)   AS edu_ids,
           collect(f_edu.text) AS edu_texts

      OPTIONAL MATCH (c:FRU {paper_id: $pid, function: 'Compensation'})-[:COVERS]->(c_edu:EDU)
      WHERE c_edu.section = section
        AND c_edu.order >= f_start - 3
        AND c_edu.order <= f_end + 8

      WITH f, section, edu_ids, edu_texts, count(DISTINCT c) AS nearby_compensation_count
      WHERE nearby_compensation_count = 0

      RETURN f.id AS fru_id, f.summary AS summary, edu_ids, edu_texts, section
    defect_label: UncompensatedConcession

  - id: REL-11
    name: Specific-Generalization
    description: |
      具體案例 (specific) 應導向通則 (generalization)，反之通則應有具體案例支撐。
      只有特例沒泛化、或只有泛化沒實例都是缺陷。
    candidate_query: |
      // 錨定 Paper 起手：零 Specific 也要回一列，否則「只有泛化沒實例」
      // 這一半永遠不 fire（原版 MATCH Specific 起手，零節點 → 0 rows →
      // 直接跳過 LLM 判讀）。collect(DISTINCT 節點) 會略過 null，
      // 空集合正確回 []。
      MATCH (p:Paper {id: $pid})
      OPTIONAL MATCH (f1:FRU {paper_id: $pid, function: 'Specific'})
      WITH p, collect(DISTINCT f1) AS specs
      OPTIONAL MATCH (f2:FRU {paper_id: $pid, function: 'Generalization'})
      WITH specs, collect(DISTINCT f2) AS gens
      // 兩側皆零＝全文根本沒用這種論證結構（常見於短 draft），
      // 「失衡」無從談起 → 跳過，省一次 LLM 判讀。
      WHERE size(specs) + size(gens) > 0
      RETURN [x IN specs | {id: x.id, summary: x.summary}] AS specifics,
             [x IN gens | {id: x.id, summary: x.summary}] AS generalizations
    defect_label: SpecificGeneralizationImbalance

  - id: REL-12
    name: Core-Restatement
    description: |
      Conclusion 應重述論文核心主張 (與 Abstract/Introduction 的核心一致)。
      Conclusion 與全文核心錯位是缺陷。
    candidate_query: |
      MATCH (p:Paper {id: $pid})
      OPTIONAL MATCH (p)-[:HAS_EDU]->(a:EDU {section: 'Abstract'})
      OPTIONAL MATCH (p)-[:HAS_EDU]->(c:EDU {section: 'Conclusion'})
      WITH collect(DISTINCT a.text) AS abstract_texts,
           collect(DISTINCT c.text) AS conclusion_texts
      RETURN abstract_texts, conclusion_texts
    defect_label: ConclusionMisaligned

  - id: REL-13
    name: Meta-Discourse
    description: |
      論文應有適當的後設論述 (例如「本節將介紹...」、「下一節討論...」、章節導引)，
      幫助讀者導航。完全缺乏或氾濫使用都是問題。
    candidate_query: |
      // 錨定 Paper 起手：完全零 MetaDiscourse 也要回一列（原版 MATCH 起手，
      // 零節點 → 0 rows → 「完全缺後設論述」這一半永遠不 fire）。
      // 附 paper_sections 當分母，讓 LLM 能同時判「缺乏」與「氾濫」。
      MATCH (p:Paper {id: $pid})
      OPTIONAL MATCH (f:FRU {paper_id: $pid, function: 'MetaDiscourse'})-[:COVERS]->(d:EDU)
      WITH p, f, collect(d.id) AS edu_ids, collect(d.text) AS edu_texts,
           collect(d.section)[0] AS section
      WITH p, [x IN collect({fru_id: f.id, summary: f.summary, section: section,
                             edu_ids: edu_ids, edu_texts: edu_texts})
               WHERE x.fru_id IS NOT NULL] AS meta_discourse_frus
      OPTIONAL MATCH (p)-[:HAS_EDU]->(e:EDU)
      WITH meta_discourse_frus, collect(DISTINCT e.section) AS paper_sections
      // 零 EDU 的空文件（殘留 draft）連「缺後設論述」都無從判 → 跳過。
      WHERE size(paper_sections) > 0
      RETURN meta_discourse_frus, paper_sections
    defect_label: MetaDiscourseImbalance
