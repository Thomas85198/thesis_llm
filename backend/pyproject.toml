[project]
name = "thesis-llm-demo-v3"
version = "0.1.0"
description = "論文檢核系統：EDU → ER → RST/FRU → Neo4j KG → 13 REL 規則檢核"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "openai>=1.55",
    # "anthropic>=0.40",  # preserved for reference; re-enable to switch back
    "neo4j>=5.26",
    "pydantic>=2.10",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
py-modules = ["main"]
